services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ${ENV_FILE:-person1.env}
    environment:
      # RemediationAgent defaults to http://localhost:8081, which is wrong
      # inside this container — "localhost" here means the backend
      # container itself, not the sibling wrapper container. Docker
      # Compose's embedded DNS resolves service names, so this must be the
      # service name, not localhost. Without this, every remediation call
      # gets connection-refused and the FSM never gets past REMEDIATING.
      - WRAPPER_URL=http://wrapper:8081
    volumes:
      - ./backend:/app
      - audit_logs:/app/audit_logs
    depends_on:
      - wrapper
    profiles:
      - full-stack

  wrapper:
    build: ./wrapper
    ports:
      - "8081:8081"
    env_file:
      - ${ENV_FILE:-person1.env}
    volumes:
      - ./wrapper:/app
    mem_limit: 4g
    cpus: 2
    profiles:
      - full-stack

  dashboard:
    build: ./dashboard
    ports:
      - "3000:3000"
    volumes:
      - ./dashboard:/app
      - /app/node_modules
    environment:
      - VITE_BACKEND_URL=${VITE_BACKEND_URL:-http://localhost:8000}

volumes:
  audit_logs: