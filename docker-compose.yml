services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ${ENV_FILE:-person1.env}
    environment:
      # RemediationAgent defaults to http://localhost:8081, which is wrong
      # inside this container — "localhost" here means the backend
      # container itself, not the sibling wrapper container. Docker
      # Compose's embedded DNS resolves service names, so this must be the
      # service name, not localhost. Without this, every remediation call
      # gets connection-refused and the FSM never gets past REMEDIATING.
      - WRAPPER_URL=http://wrapper:8081
    # Day 15: SentinelAgent's sentence-transformers fallback model
    # downloads from huggingface.co the first time a container starts
    # (no weights baked into the image). Found via a real clean-machine
    # docker-compose test: some Docker network configs' default embedded
    # DNS resolver fails on that specific hostname (confirmed by testing
    # from inside a throwaway container — Docker Hub itself resolved
    # fine, huggingface.co didn't, until an explicit DNS server was set)
    # even though the same host resolves it fine outside Docker. An
    # explicit public DNS server is a harmless default either way and a
    # real fix where it matters.
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ./backend:/app
      - audit_logs:/app/audit_logs
    depends_on:
      - wrapper
    profiles:
      - full-stack

  wrapper:
    build: ./wrapper
    ports:
      - "8081:8081"
    env_file:
      - ${ENV_FILE:-person1.env}
    volumes:
      - ./wrapper:/app
    mem_limit: 4g
    cpus: 2
    profiles:
      - full-stack

  dashboard:
    build:
      context: ./dashboard
      # Vite inlines VITE_* env vars at build time (see Dockerfile), so
      # these must be build args, not container `environment:` — a
      # runtime env var has zero effect on an already-built static
      # bundle. Previously VITE_WS_URL wasn't set anywhere in this file
      # at all, so /ws/stream never connected under `docker compose up`.
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:8000}
        VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:8000/ws/stream}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    # Previously missing this profile entirely while `backend` and
    # `wrapper` both had it — meaning a bare `docker compose up` (no
    # --profile flag) started ONLY the dashboard, against a backend that
    # was never brought up. All three services now come up together.
    profiles:
      - full-stack

volumes:
  audit_logs: